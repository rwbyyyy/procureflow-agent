[project]
name = "procureflow-agent-demo"
version = "0.1.0"
description = "LangGraph procurement agent with approvals, evidence and durable execution"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
